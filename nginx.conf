events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Security headers - this is a static site, no sensitive data is served
    # (answer keys are excluded from the image at build time via .dockerignore).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # This repo's own tooling ships inside the image build context but
        # must never be served - deny it even though the files physically
        # exist under the web root.
        location ~ ^/(Dockerfile|docker-compose\.yml|nginx\.conf|README\.md|\.dockerignore)$ {
            deny all;
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
